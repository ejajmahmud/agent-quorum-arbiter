[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-quorum-arbiter"
version = "0.1.0"
description = "Paxos/Raft-inspired Byzantine fault-tolerant voting arbiter for critical multi-agent consensus decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-quorum-arbiter = "agent_quorum_arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_quorum_arbiter*"]
